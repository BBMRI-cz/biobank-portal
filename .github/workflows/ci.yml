name: CI/CD Pipeline

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read # needed by dorny/paths-filter on pull requests

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Finds out which parts of the repo changed, so backend jobs are skipped for
  # frontend-only changes and vice versa. Filtering here (instead of with
  # `on.<event>.paths`) keeps the required "CI Result" check always reporting.
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - '.github/workflows/ci.yml'
            frontend:
              - 'frontend/**'
              - '.nvmrc'
              - '.github/workflows/ci.yml'

  backend:
    name: ${{ matrix.name }} (Backend)
    needs: changes
    if: needs.changes.outputs.backend == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Code Format
            run: mvn -B -ntp fmt:check
          # Unit (*Test) and integration (*IT) tests; Testcontainers uses the runner's Docker
          - name: Unit & Integration Tests
            run: mvn -B -ntp verify
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - run: ${{ matrix.run }}

  frontend:
    name: ${{ matrix.name }} (Frontend)
    needs: changes
    if: needs.changes.outputs.frontend == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Lint
            run: npm run lint:check
          - name: Code Format
            run: npm run format:check
          - name: Type Check
            run: npm run type-check
          - name: Unit Tests
            run: npm test
          - name: Build
            run: npm run build-only
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: ${{ matrix.run }}

  # Single check to require in branch protection. Passes when every job that
  # had to run succeeded; jobs skipped by the path filter count as passed.
  ci-result:
    name: CI Result
    if: always()
    needs: [changes, backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any job failed or was cancelled
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: |
          echo "Results: changes=${{ needs.changes.result }} backend=${{ needs.backend.result }} frontend=${{ needs.frontend.result }}"
          exit 1
      - run: echo "All required jobs passed."
