name: CI/CD Pipeline

on:
  push:
    branches: [master]
    tags: ['v*.*.*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REGISTRY: ghcr.io
  PUSH: ${{ github.event_name == 'push' }}

jobs:
  changes:
    name: Detect Changes
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - 'Dockerfile'
              - '.dockerignore'
              - '.github/workflows/ci.yml'
            frontend:
              - 'frontend/**'
              - '.nvmrc'
              - '.github/workflows/ci.yml'

  backend:
    name: ${{ matrix.name }} (Backend)
    needs: changes
    if: ${{ !cancelled() && needs.changes.result != 'failure' }}
    runs-on: ubuntu-latest
    env:
      CHANGED: ${{ github.event_name != 'pull_request' || needs.changes.outputs.backend == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Code Format
            run: mvn -B -ntp fmt:check
          - name: Unit & Integration Tests
            run: mvn -B -ntp verify
    defaults:
      run:
        working-directory: backend
    steps:
      - if: env.CHANGED == 'true'
        uses: actions/checkout@v7
      - if: env.CHANGED == 'true'
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - if: env.CHANGED == 'true'
        run: ${{ matrix.run }}

  frontend:
    name: ${{ matrix.name }} (Frontend)
    needs: changes
    if: ${{ !cancelled() && needs.changes.result != 'failure' }}
    runs-on: ubuntu-latest
    env:
      CHANGED: ${{ github.event_name != 'pull_request' || needs.changes.outputs.frontend == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Lint
            run: npm run lint:check
          - name: Code Format
            run: npm run format:check
          - name: Type Check
            run: npm run type-check
          - name: Unit Tests
            run: npm test
          - name: Build
            run: npm run build-only
    defaults:
      run:
        working-directory: frontend
    steps:
      - if: env.CHANGED == 'true'
        uses: actions/checkout@v7
      - if: env.CHANGED == 'true'
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - if: env.CHANGED == 'true'
        run: npm ci
      - if: env.CHANGED == 'true'
        run: ${{ matrix.run }}

  image:
    name: Container Image
    needs: [changes, backend, frontend]
    if: >-
      ${{ !cancelled()
      && !contains(needs.*.result, 'failure')
      && (github.event_name != 'pull_request'
      || needs.changes.outputs.backend == 'true'
      || needs.changes.outputs.frontend == 'true') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/biobank-portal
          flavor: latest=false
          tags: |
            type=sha,format=long,prefix=
            type=semver,pattern={{version}}

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - if: env.PUSH == 'true'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: ${{ env.PUSH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            REVISION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - if: env.PUSH == 'true'
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - name: Sign image
        if: env.PUSH == 'true'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE: ${{ env.REGISTRY }}/${{ github.repository_owner }}/biobank-portal
        run: cosign sign --yes "${IMAGE,,}@${DIGEST}"

  ci-result:
    name: CI Result
    if: always()
    needs: [changes, backend, frontend, image]
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any job failed or was cancelled
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: |
          echo "Results: changes=${{ needs.changes.result }} backend=${{ needs.backend.result }} frontend=${{ needs.frontend.result }} image=${{ needs.image.result }}"
          exit 1
      - run: echo "All required jobs passed."
